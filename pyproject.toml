[project]
name = "mgr"
version = "0.1.0"
description = "TUI for spitballing a planning window and handing it to Linear via an LLM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "textual>=8.2.8",
]

[project.scripts]
mgr = "mgr.cli:main"

[build-system]
requires = ["uv_build>=0.8.12,<0.9"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Textual declares BINDINGS/CSS as plain mutable class attributes by design.
ignore = ["RUF012"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
